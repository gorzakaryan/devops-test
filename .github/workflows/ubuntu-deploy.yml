name: Ubuntu Deploy

on:
#  push:
#    branches:
#      - master
  workflow_dispatch:  # ← adds manual trigger

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/html/devops

            echo "=================================="
            echo "Pull latest code"
            echo "=================================="
            git reset --hard
            git pull origin master

            composer install

            echo "Build frontend"
            npm install
            npm run build

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=================================="
            echo "Run migrations"
            echo "=================================="
            php artisan migrate --force

            echo "=================================="
            echo "Restart queues (safe)"
            echo "=================================="
            nohup php artisan queue:restart > /dev/null 2>&1 & || true

            echo "=================================="
            echo "Start Reverb (WebSocket)"
            echo "=================================="
            nohup php artisan reverb:start > /dev/null 2>&1 & || true

            echo "=================================="
            echo "UBUNTU Deploy finished successfully"
            echo "=================================="
