name: Laravel Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:  # ← adds manual trigger

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            cd /var/www/html/saas

            echo "=================================="
            echo "Pull latest code"
            echo "=================================="
            git switch master
            git reset --hard
            git pull origin master

            echo "Install node modules"
            npm install

            echo "Build frontend"
            npm run dev

            docker compose exec -T saas php artisan optimize:clear
            docker compose exec -T saas php artisan config:cache
            docker compose exec -T saas php artisan route:cache
            docker compose exec -T saas php artisan view:cache

            echo "=================================="
            echo "Run migrations"
            echo "=================================="
            docker compose exec -T saas php artisan migrate --force

            echo "=================================="
            echo "Restart queues (safe)"
            echo "=================================="
            docker compose exec -T saas php artisan queue:restart

            echo "=================================="
            echo "Start Reverb (WebSocket)"
            echo "=================================="
            docker compose exec saas pkill -f reverb
            docker compose restart saas
            docker compose exec -d saas php artisan reverb:start || true

            echo "=================================="
            echo "Rebuild containers (if needed)"
            echo "=================================="
            docker compose up -d --build

            echo "=================================="
            echo "Bring app back online"
            echo "=================================="
            docker compose exec -T saas php artisan up || true

            echo "=================================="
            echo "Deploy finished successfully"
            echo "=================================="
